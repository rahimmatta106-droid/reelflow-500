# ReelFlow 500 — Free cloud APK build (GitHub Actions)
# Push this repo to GitHub → Actions builds the APK automatically → download it.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelFlow-500-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build (signed) — only when the release keystore secrets exist
      # in this repo: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      - name: Install release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          ls -la android/release.keystore

      - name: Build Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReelFlow-500-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
