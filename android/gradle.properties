# Gradle settings.
# CI (GitHub Actions runners, 7 GB RAM): the daemon uses 2 GB heap.
# Local builds on the dev VM do NOT work: the sandbox blocks Java TCP
# connections (Gradle's daemon IPC over localhost gets intercepted), so
# local Gradle cannot talk to its daemon nor download dependencies.
# Use the GitHub Actions workflow (.github/workflows/build-apk.yml) to build.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
